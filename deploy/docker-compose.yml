services:
  backend:
    build:
      context: ..

    env_file:
      - ../.env

    restart: unless-stopped

    volumes:
      - ../certs:/app/certs:ro
      - ../.env:/app/.env:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      NGINX_ENVSUBST_FILTER: SERVER_NAME

    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${STOREFRONT_PATH}:/usr/share/nginx/store:ro
      - ${ADMIN_PATH}:/usr/share/nginx/admin:ro
