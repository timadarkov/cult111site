services:
  backend:
    build:
      context: ..

    restart: unless-stopped

    volumes:
      - ../certs:/app/certs:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  
  nginx:
    image: nginx:alpine
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      NGINX_ENVSUBST_FILTER: SERVER_NAME

    volumes:
      - ./nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${STOREFRONT_PATH}:/usr/share/nginx/store:ro
      - ${ADMIN_PATH}:/usr/share/nginx/admin:ro
      - ../certbot/www:/var/www/certbot:ro
      - ../certbot/conf:/etc/letsencrypt:ro
      - /home/deploy/cult111main:/usr/share/nginx/main:ro
      - /home/deploy/sewerroomfront:/usr/share/nginx/sewerroom:ro
      - /home/deploy/cult111musicfront:/usr/share/nginx/musicfrint:ro
      - /home/deploy/cult111musicback:/usr/share/nginx/musicback:ro


  certbot:
    image: certbot/certbot:latest
 
    profiles:
      - tools
  
    volumes:
      - ../certbot/www:/var/www/certbot
      - ../certbot/conf:/etc/letsencrypt
