services:
  backend:
    build:
      context: ..

    env_file:
      - ../.env

    restart: unless-stopped

    volumes:
      - ../certs:/app/certs:ro
      - ../.env:/app/.env:ro

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
