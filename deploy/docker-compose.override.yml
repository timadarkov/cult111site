services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    environment:
      DB_HOST: ${DB_HOST}
      DB_DIRECT_HOST: ${DB_DIRECT_HOST}
      DB_PORT: ${DB_PORT}

    volumes:
      - ../app:/app/app
      - ../main.py:/app/main.py
      - ../database.py:/app/database.py

    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

volumes:
  postgres_data:
