[project]
name = "cult111site"
version = "0.1.0"
description = "Backend API for CULT111 store"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi (==0.125.0)", "uvicorn (==0.38.0)", "sqlalchemy (==2.0.45)", "psycopg2-binary (==2.9.12)", "alembic (==1.20.0)", "pydantic (==2.12.5)", "pydantic-settings (==2.15.0)", "pyjwt[crypto] (==2.15.1)", "bcrypt (==5.0.0)", "boto3 (==1.43.72)", "slowapi (==0.1.10)", "email-validator (==2.3.0)", "botocore (==1.43.114)"]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = ["pytest (>=9.1.1,<10.0.0)", "pytest-asyncio (>=1.4.0,<2.0.0)", "httpx (>=0.28.1,<0.29.0)"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra"
